media:
  input: public/assets
  output: /assets

content:
  - name: posts
    label: "\u6587\u7ae0"
    type: collection
    path: src/content/posts
    view:
      primary: title
      fields: [title, category, draft, published]
    fields:
      - name: published
        label: "\u53d1\u5e03\u65f6\u95f4"
        type: date
        required: true
      - name: updated
        label: "\u66f4\u65b0\u65f6\u95f4"
        type: date
      - name: title
        label: "\u6807\u9898"
        type: string
        required: true
      - name: category
        label: "\u5206\u7c7b"
        type: string
        required: true
      - name: tags
        label: "\u6807\u7b7e"
        type: string
        list: true
      - name: featured
        label: "\u7f6e\u9876"
        type: boolean
      - name: draft
        label: "\u8349\u7a3f"
        type: boolean
      - name: image
        label: "\u5c01\u9762\u56fe"
        type: string
      - name: ogImage
        label: "\u5206\u4eab\u56fe"
        type: string
      - name: description
        label: "\u6458\u8981"
        type: text
        required: true
      - name: seoTitle
        label: "\u0053\u0045\u004f\u0020\u6807\u9898"
        type: string
      - name: seoDescription
        label: "\u0053\u0045\u004f\u0020\u63cf\u8ff0"
        type: text
      - name: body
        label: "\u6b63\u6587"
        type: rich-text
        description: "\u5148\u53bb\u5de6\u4fa7\u201c\u5199\u4f5c\u6a21\u677f\u201d\u6311\u4e00\u5957\u7ed3\u6784\u518d\u6765\u586b\u3002\u63d2\u5165\u56fe\u7247\u4e0d\u8981\u53ea\u5199\u6587\u4ef6\u540d\uff0c\u8981\u7528\uff1a![\u56fe\u7247\u8bf4\u660e](/assets/\u8c37\u6b4c\u914d\u7f6e/chrome-3ol8jp82pl.png)"
        options:
          input: public/assets
          output: /assets

  - name: writing_templates
    label: "\u5199\u4f5c\u6a21\u677f"
    type: collection
    path: docs/post-templates
    subfolders: false
    operations:
      create: false
      delete: false
      rename: false
    view:
      primary: title
      fields: [style, useCase]
    fields:
      - name: title
        label: "\u6a21\u677f\u540d"
        type: string
        required: true
      - name: style
        label: "\u98ce\u683c"
        type: string
        required: true
      - name: useCase
        label: "\u9002\u5408\u573a\u666f"
        type: text
        required: true
      - name: body
        label: "\u6a21\u677f\u6b63\u6587"
        type: rich-text
        options:
          input: public/assets
          output: /assets

  - name: about
    label: "\u5173\u4e8e\u9875"
    type: file
    path: src/content/spec/about.md
    fields:
      - name: body
        label: "\u6b63\u6587"
        type: rich-text
        options:
          input: public/assets
          output: /assets
